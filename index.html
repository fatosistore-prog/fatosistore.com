<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatosi Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      padding: 20px;
      text-align: center;
    }
    .container {
      text-align: center;
    }
    h1 {
      font-size: clamp(28px, 6vw, 72px);
      font-weight: 700;
      color: #D4AF37;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.3),
                   0 0 80px rgba(212, 175, 55, 0.15);
      letter-spacing: 3px;
      line-height: 1.3;
      animation: fadeIn 2s ease-out;
      margin-bottom: 10px;
    }
    .subtitle {
      color: rgba(212, 175, 55, 0.6);
      font-size: clamp(12px, 2vw, 18px);
      margin-top: 0;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-family: 'Arial', sans-serif;
      animation: fadeIn 3s ease-out;
      margin-bottom: 30px;
    }
    .social-links {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    .social-links a {
      color: rgba(255,255,255,0.7);
      font-size: 18px;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .social-links a:hover {
      color: #fff;
      transform: translateY(-3px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fatosi Store</h1>
    <p class="subtitle">WEB COMING SOON!</p>
    <div class="social-links">
      <a href="https://www.facebook.com/BizhuteriaTeFatosi/" target="_blank">Facebook</a>
      <a href="https://www.instagram.com/fatosistore" target="_blank">Instagram</a>
      <a href="https://www.tiktok.com/@fatosi.store?_r=1&_t=ZS-96qybsGMPv5" target="_blank">TikTok</a>
      <a href="https://maps.app.goo.gl/dHdrPxBg5ecfXi1N9" target="_blank">Location</a>
    </div>
  </div>
</body>
</html>
