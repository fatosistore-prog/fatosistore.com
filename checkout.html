<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porosia — FatosiStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
          <img src="images/logo.png" alt="Fatosi Store" style="height:50px;background:#fff;border-radius:8px;padding:4px;">
          <span style="font-family:'Montserrat','Segoe UI',sans-serif;font-weight:800;font-size:22px;color:#fff;text-transform:uppercase;letter-spacing:1px;"><span style="color:#fff;">FATOSI</span><span style="color:#FFD700;">STORE</span></span>
        </a>
      <div class="header-actions">
        <a href="index.html">← Kthehu në Dyqan</a>
      </div>
    </div>
  </header>

  <section class="checkout-section">
    <h1>📦 Plotëso Porosinë</h1>

    <div class="order-summary" id="orderSummary">
      <!-- Populated by JS -->
    </div>

    <form id="checkoutForm" onsubmit="placeOrder(event)">
      <div class="form-row">
        <div class="form-group">
          <label>Emri *</label>
          <input type="text" id="firstName" required placeholder="Emri">
        </div>
        <div class="form-group">
          <label>Mbiemri *</label>
          <input type="text" id="lastName" required placeholder="Mbiemri">
        </div>
      </div>
      <div class="form-group">
        <label>Numri i Telefonit *</label>
        <input type="tel" id="phone" required placeholder="+355 6X XXX XXXX">
      </div>
      <div class="form-group">
        <label>Adresa e Dorëzimit *</label>
        <textarea id="address" required placeholder="Rruga, Numri, Qyteti, Kodi Postar"></textarea>
      </div>
      <div class="form-group">
        <label>Shënime (opsionale)</label>
        <textarea id="notes" placeholder="Çdo informacion shtesë për dorëzimin..."></textarea>
      </div>

      <div class="cod-notice">
        💵 <strong>Pagesa në Dorëzim</strong> — Pagesa bëhet kur merrni produktin nga postieri.
      </div>

      <button type="submit" class="btn-place-order">✅ Konfirmo Porosinë</button>
    </form>
  </section>

  <script>
    const tkA='github_pat_11CEWPKGY';
    const tkB='0orovFnfGpERW_KdzDij';
    const tkC='hXbMoZ0wO4KhH8EhzAYB';
    const tkD='b7Me4uaitxX8oXbJHGI3DMIWZS1vqCXvE';
    const GH_TOKEN=tkA+tkB+tkC+tkD;
    const GH_API = 'https://api.github.com/repos/fatosistore-prog/fatosistore.com/contents/data.json';
    let ghSha = null;

    async function saveOrdersToGitHub() {
      try {
        const productsResp = await fetch(GH_API, {
          headers: { 'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
        });
        let products = [];
        if (productsResp.ok) {
          const data = await productsResp.json();
          ghSha = data.sha;
          const parsed = JSON.parse(atob(data.content));
          products = parsed.products || [];
        }
        const orders = getOrders();
        const data = JSON.stringify({products, orders}, null, 2);
        const b64 = btoa(unescape(encodeURIComponent(data)));
        const body = { message: 'New order', content: b64 };
        if (ghSha) body.sha = ghSha;
        await fetch(GH_API, {
          method: 'PUT',
          headers: { 'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        console.log('Order saved to GitHub');
      } catch(e) { console.log('GitHub error:', e); }
    }

    function getCart() { return JSON.parse(localStorage.getItem('fatosi_cart') || '[]'); }
    function getOrders() { return JSON.parse(localStorage.getItem('fatosi_orders') || '[]'); }
    function formatPrice(price) {
      return price.toFixed(2) + ' €';
    }

    function renderSummary() {
      const cart = getCart();
      const summary = document.getElementById('orderSummary');
      if (cart.length === 0) {
        window.location.href = 'index.html';
        return;
      }

      let subtotal = 0, shipping = 0;
      let itemsHtml = cart.map(item => {
        subtotal += item.price * item.quantity;
        shipping += (item.shipping || 0) * item.quantity;
        return `<div class="summary-item" style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;">
          <div style="flex:1;">
            <strong>${item.name}</strong><br>
            <span style="color:#888;font-size:13px;">${formatPrice(item.price)} copa</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick="changeQty(${item.id}, -1)" style="width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:16px;">−</button>
            <span style="min-width:20px;text-align:center;font-weight:700;">${item.quantity}</span>
            <button onclick="changeQty(${item.id}, 1)" style="width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:16px;">+</button>
          </div>
          <div style="min-width:80px;text-align:right;font-weight:700;color:var(--primary);">${formatPrice(item.price * item.quantity)}</div>
        </div>`;
      }).join('');

      summary.innerHTML = `
        <h3>📋 Përmbledhja e Porosisë</h3>
        ${itemsHtml}
        <div class="summary-item">
          <span>Posta</span>
          <span>${shipping > 0 ? formatPrice(shipping) : 'Falas'}</span>
        </div>
        <div class="summary-total">
          <span>Totali</span>
          <span class="amount">${formatPrice(subtotal + shipping)}</span>
        </div>
      `;
    }

    function changeQty(id, delta) {
      let cart = getCart();
      const item = cart.find(i => i.id === id);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
        localStorage.setItem('fatosi_cart', JSON.stringify(cart));
        renderSummary();
      }
    }

    function placeOrder(e) {
      e.preventDefault();
      const cart = getCart();
      if (cart.length === 0) return;

      let subtotal = 0, shipping = 0;
      cart.forEach(item => {
        subtotal += item.price * item.quantity;
        shipping += (item.shipping || 0) * item.quantity;
      });

      const order = {
        id: 'FS-' + Date.now().toString(36).toUpperCase(),
        date: new Date().toISOString(),
        customer: {
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          phone: document.getElementById('phone').value,
          address: document.getElementById('address').value,
          notes: document.getElementById('notes').value
        },
        items: cart,
        subtotal: subtotal,
        shipping: shipping,
        total: subtotal + shipping,
        status: 'new'
      };

      const orders = getOrders();
      orders.push(order);
      localStorage.setItem('fatosi_orders', JSON.stringify(orders));
      sessionStorage.setItem('fatosi_orders_backup', JSON.stringify(orders));
      saveOrdersToGitHub();
      sessionStorage.setItem('fatosi_orders_backup', JSON.stringify(orders));
      localStorage.removeItem('fatosi_cart');
      // Send Telegram notification
      sendTelegramNotification(order);

      document.querySelector('.checkout-section').innerHTML = `
        <div class="confirmation-section">
          <div class="check-icon">✅</div>
          <h1>Porosia u krye me sukses!</h1>
          <p>Numri i porosisë: <strong>${order.id}</strong></p>
          <p>Faleminderit ${order.customer.firstName}! Do t'ju kontaktojmë së shpejti për konfirmim.</p>
          <p style="margin-top:16px;"><strong>Pagesa në dorëzim:</strong> ${formatPrice(order.total)}</p>
          <a href="index.html" class="btn" style="display:inline-block; margin-top:24px; background:var(--primary); color:white; padding:14px 28px; border-radius:var(--radius-sm); font-weight:700;">← Kthehu në Dyqan</a>
        </div>
      `;
    }

    // Telegram notification
    function sendTelegramNotification(order) {
      const token = '8794130383:AAF0iaKniURH9wjtBD711krXAK2zVOfbLns';
      const chatId = '8526963580';
      const items = order.items.map(i => `- ${i.name} x${i.quantity}: ${formatPrice(i.price * i.quantity)}`).join('\n');
      const msg = '🛒 POROSI E RE!\n\nID: ' + order.id +
        '\nKlienti: ' + order.customer.firstName + ' ' + order.customer.lastName +
        '\nTel: ' + order.customer.phone +
        '\nAdresa: ' + order.customer.address +
        '\n\nProduktet:\n' + items +
        '\n\nPosta: ' + formatPrice(order.shipping) +
        '\nTOTALI: ' + formatPrice(order.total) +
        '\n\nPagesa në dorëzim 💵';
      const url = 'https://api.telegram.org/bot' + token + '/sendMessage';
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: msg })
      })
        .then(r => { if(r.ok) console.log('Telegram OK'); else console.log('Telegram fail', r.status); })
        .catch(e => console.log('Telegram error:', e));
    }

    renderSummary();
  </script>
</body>
</html>
